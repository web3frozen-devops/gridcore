name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

# NOTE: GitHub's dependency-review action is intentionally not configured. It
# requires the repository Dependency Graph, which is not available here (the
# SBOM API returns 404 for this repo and its siblings). This module also has
# zero third-party dependencies, so Dependabot and govulncheck cover the risk.

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
