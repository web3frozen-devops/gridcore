name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test gridcore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: |
          TOTAL="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${TOTAL}%"
          FLOOR=100
          if awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN { exit !(t+0 >= f) }'; then
            echo "Coverage ${TOTAL}% >= floor ${FLOOR}%"
          else
            echo "Coverage ${TOTAL}% is below the ${FLOOR}% floor"
            exit 1
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  consumer-smoke:
    name: External consumer can fetch gridcore
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
      # The module may not be indexed by the checksum DB yet right after a push;
      # fetching directly over HTTPS needs no credentials because the repo is public.
      GOSUMDB: 'off'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Fetch and run gridcore as an external module
        env:
          # On pull_request, github.sha is an ephemeral merge commit that does
          # not exist in the repository, so fetch the real PR head commit.
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          go mod init smoke
          if ! go get "github.com/web3frozen-devops/gridcore@${REF}"; then
            echo "::warning::could not fetch ${REF} (fork PR or unindexed commit); falling back to @latest"
            go get "github.com/web3frozen-devops/gridcore@latest"
          fi
          cat > main.go <<'GO'
          package main

          import (
          	"fmt"

          	"github.com/web3frozen-devops/gridcore"
          )

          func main() {
          	id := gridcore.EncodeBuyClientOrderID(3)
          	level, side, ok := gridcore.DecodeClientOrderID(id)
          	fmt.Println(level, side, ok, gridcore.RoundPrice(99804.9, 2))
          }
          GO
          go run .
